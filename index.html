    <script>
/* Happy Wheels off-domain fix.
   The game fetches levels from totaljerkface.com, which blocks
   cross-origin requests. /tjf/ is proxied to totaljerkface.com
   by vercel.json (same-origin, so no CORS block).
   Also, the game's level loader opens a synchronous XHR with a
   responseType set, which browsers reject (InvalidAccessError);
   such requests are forced async here. */
(function () {
  function proxify(u) {
    if (typeof u !== 'string') return u;
    var i = u.indexOf('totaljerkface.com/');
    if (i >= 0) return '/tjf/' + u.slice(i + 'totaljerkface.com/'.length);
    if (u.indexOf('googleusercontent.com') >= 0) return '/tjf/get_level.hw';
    return u;
  }
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u, a, us, pw) {
    var nu = proxify(u);
    var rt = this.responseType;
    if (a === false && rt && rt !== '') {
      try { this.responseType = ''; } catch (e) {}
      a = true;
      var r = origOpen.call(this, m, nu, a, us, pw);
      try { this.responseType = rt; } catch (e) {}
      return r;
    }
    var r2;
    try {
      r2 = origOpen.call(this, m, nu, a, us, pw);
    } catch (e) {
      if (String(e).indexOf('Synchronous') >= 0 || String(e.name).indexOf('InvalidAccess') >= 0) {
        try { this.responseType = ''; } catch (e2) {}
        r2 = origOpen.call(this, m, nu, true, us, pw);
        if (rt) { try { this.responseType = rt; } catch (e3) {} }
      } else { throw e; }
    }
    return r2;
  };
  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function (u, o) {
      var nu = (typeof u === 'string') ? proxify(u) : u;
      return origFetch.call(this, nu, o);
    };
  }
})();
</script>

<script>
/* Mobile touch controls: on-screen buttons dispatch synthetic arrow/space/Z
   key events to the game (the stage listens on document for keydown/keyup
   and reads event.keyCode). Buttons dispatch on document.body so the event
   target is BODY (the game preventDefaults arrows/space only for BODY). */
(function () {
  var KEYMAP = {
    'hw-left':  {code: 37, key: 'ArrowLeft',  c: 'ArrowLeft'},
    'hw-right': {code: 39, key: 'ArrowRight', c: 'ArrowRight'},
    'hw-up':    {code: 38, key: 'ArrowUp',    c: 'ArrowUp'},
    'hw-down':  {code: 40, key: 'ArrowDown',  c: 'ArrowDown'},
    'hw-jump':  {code: 32, key: ' ',          c: 'Space'},
    'hw-eject': {code: 90, key: 'z',          c: 'KeyZ'}
  };
  function sendKey(k, type) {
    var e;
    try {
      e = new KeyboardEvent(type, {bubbles: true, cancelable: true, key: k.key, code: k.c});
    } catch (err) {
      e = document.createEvent('Event');
      e.initEvent(type, true, true);
    }
    try { Object.defineProperty(e, 'keyCode', {value: k.code}); } catch (err) {}
    try { Object.defineProperty(e, 'which', {value: k.code}); } catch (err) {}
    try { Object.defineProperty(e, 'key', {value: k.key}); } catch (err) {}
    (document.body || document.documentElement).dispatchEvent(e);
  }
  function bindBtn(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var k = KEYMAP[id];
    var held = false;
    function down(ev) {
      if (ev) { ev.preventDefault(); }
      if (held) return;
      held = true;
      el.classList.add('held');
      sendKey(k, 'keydown');
    }
    function up(ev) {
      if (ev) { ev.preventDefault(); }
      if (!held) return;
      held = false;
      el.classList.remove('held');
      sendKey(k, 'keyup');
    }
    el.addEventListener('touchstart', down, {passive: false});
    el.addEventListener('touchend', up, {passive: false});
    el.addEventListener('touchcancel', up, {passive: false});
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
    el.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  }
  Object.keys(KEYMAP).forEach(bindBtn);
  var touch = document.getElementById('hw-touch');
  var toggle = document.getElementById('hw-toggle');
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  if (isTouch) touch.classList.add('on');
  toggle.addEventListener('click', function () { touch.classList.toggle('on'); });
  toggle.addEventListener('touchstart', function (ev) { ev.preventDefault(); touch.classList.toggle('on'); }, {passive: false});
})();
</script>
