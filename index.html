    <script>
(function () {
  function log(msg) {
    var el = document.getElementById('hwlog');
    if (!el) {
      el = document.createElement('div');
      el.id = 'hwlog';
      el.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:#000;color:#0f0;font:10px monospace;max-height:40vh;overflow:auto;pointer-events:none;white-space:pre-wrap;opacity:.85;padding:2px;';
      document.body.appendChild(el);
    }
    el.textContent += (new Date().toISOString().slice(11,19)) + ' ' + msg + '\n';
  }
  window.__hwlog = log;
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u, a) {
    this._hwurl = u; this._hwmethod = m;
    return origOpen.apply(this, arguments);
  };
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function (body) {
    var xhr = this;
    var url = String(xhr._hwurl || '');
    if (url.indexOf('get_level') >= 0 || url.indexOf('/tjf/') >= 0) {
      log('SEND ' + xhr._hwmethod + ' ' + url + ' body=' + String(body || '').slice(0, 200));
      xhr.addEventListener('load', function () {
        var t = '';
        try { t = String(xhr.responseText || '').slice(0, 120); } catch (e) { t = '[no responseText: ' + e.name + ']'; }
        log('DONE ' + url + ' status=' + xhr.status + ' len=' + (xhr.responseText ? xhr.responseText.length : -1) + ' head=' + t.replace(/\n/g, ' '));
      });
      xhr.addEventListener('error', function () { log('ERROR ' + url); });
    }
    return origSend.apply(this, arguments);
  };
})();
</script>

    <script>
/* Happy Wheels off-domain fix.
   The game fetches levels from totaljerkface.com, which blocks
   cross-origin requests. /tjf/ is proxied to totaljerkface.com
   by vercel.json (same-origin, so no CORS block).
   Also, the game's level loader opens a synchronous XHR with a
   responseType set, which browsers reject (InvalidAccessError);
   such requests are forced async here. */
(function () {
  function proxify(u) {
    if (typeof u !== 'string') return u;
    var i = u.indexOf('totaljerkface.com/');
    if (i >= 0) return '/tjf/' + u.slice(i + 'totaljerkface.com/'.length);
    if (u.indexOf('googleusercontent.com') >= 0) return '/tjf/get_level.hw';
    return u;
  }
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u, a, us, pw) {
    var nu = proxify(u);
    var rt = this.responseType;
    if (a === false && rt && rt !== '') {
      try { this.responseType = ''; } catch (e) {}
      a = true;
      var r = origOpen.call(this, m, nu, a, us, pw);
      try { this.responseType = rt; } catch (e) {}
      return r;
    }
    var r2;
    try {
      r2 = origOpen.call(this, m, nu, a, us, pw);
    } catch (e) {
      if (String(e).indexOf('Synchronous') >= 0 || String(e.name).indexOf('InvalidAccess') >= 0) {
        try { this.responseType = ''; } catch (e2) {}
        r2 = origOpen.call(this, m, nu, true, us, pw);
        if (rt) { try { this.responseType = rt; } catch (e3) {} }
      } else { throw e; }
    }
    return r2;
  };
  if (window.fetch) {
    var origFetch = window.fetch;
    window.fetch = function (u, o) {
      var nu = (typeof u === 'string') ? proxify(u) : u;
      return origFetch.call(this, nu, o);
    };
  }
})();
</script>
